<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><rect width="900" height="260" rx="16" fill="#f7f9fc"/><text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#17324d">Parking controller: simple state flow</text><g font-family="Arial" font-size="15" text-anchor="middle" fill="#17324d" stroke-width="2"><rect x="55" y="95" width="150" height="65" rx="12" fill="#dceafe" stroke="#4277b8"/><text x="130" y="133" stroke="none">IDLE</text><rect x="275" y="55" width="160" height="65" rx="12" fill="#dff4e7" stroke="#39845b"/><text x="355" y="93" stroke="none">ENTRY</text><rect x="275" y="160" width="160" height="65" rx="12" fill="#fff0d9" stroke="#bd8530"/><text x="355" y="198" stroke="none">EXIT</text><rect x="590" y="95" width="160" height="65" rx="12" fill="#fde4e4" stroke="#b65c5c"/><text x="670" y="133" stroke="none">FULL</text><path d="M205 110 L275 87 M205 145 L275 190 M435 87 L590 110 M590 145 L435 190 M435 190 L275 145" fill="none" stroke="#526579"/><text x="240" y="77" stroke="none" font-size="12">car enters</text><text x="240" y="214" stroke="none" font-size="12">car leaves</text><text x="510" y="76" stroke="none" font-size="12">capacity reached</text><text x="510" y="207" stroke="none" font-size="12">space available</text></g><text x="450" y="246" text-anchor="middle" font-family="Arial" font-size="12" fill="#526579">Conceptual flow; exact transitions are described in the project README.</text></svg>